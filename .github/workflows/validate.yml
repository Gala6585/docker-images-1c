name: validate
on: [push, pull_request]
jobs:
  safe-validation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-structure.sh
      - name: Проверка ожидаемого отказа без закрытых дистрибутивов
        run: if bash scripts/validate-distr.sh; then exit 1; else echo 'Ожидаемый отказ'; fi
