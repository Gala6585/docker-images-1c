vanessa_tests:
  image:
    name: docker.devops.stng.ru/devops/docker-images/vanessa-runner-allure:<immutable-tag>
    entrypoint: [""]
  tags: [microk8s]
  script:
    - run-vanessa
    - generate-allure-report
  artifacts:
    when: always
    paths: [allure-results/, allure-report/, vanessa-logs/]
  # TEST_BASE_CONNECTION_STRING, TEST_BASE_USER и TEST_BASE_PASSWORD задаются
  # как masked/protected GitLab CI/CD Variables.

